# TLS terminates here or on a load balancer in front; its X-Forwarded-Proto only decides on HSTS
map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    https   https;
}

# the published HTTPS port; empty when it is the standard 443
map $host $https_port_suffix {
    default ":8443";
}

map $forwarded_scheme $hsts {
    https   "max-age=63072000; includeSubDomains";
    default "";
}

proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static:10m max_size=256m inactive=7d use_temp_path=off;

limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=per_ip:10m;

upstream web {
    server web:3100;
    keepalive 16;
}

upstream api {
    server api:3101;
    keepalive 16;
}

# plain HTTP only redirects; /api/health stays reachable for the container healthcheck
server {
    listen 8080;
    server_name _;
    server_tokens off;

    location = /api/health {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://api/health;
    }

    location / {
        return 301 https://$host$https_port_suffix$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 30s;
    limit_conn per_ip 50;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/proxy.conf;

    # the API rate-limits failed logins per IP itself; this caps the raw request rate before it reaches Node
    location = /api/auth/login {
        limit_req zone=login burst=20 nodelay;
        proxy_pass http://api/auth/login;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # user data: never stored by browsers or shared caches
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://api/;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # proxy_hide_header is inherited only when a location sets none, so the shared list lives in proxy.conf
    # hashed file names: safe to cache for a year in nginx and in browsers
    location /_next/static/ {
        proxy_pass http://web;
        proxy_cache static;
        proxy_cache_valid 200 365d;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Cache-Status $upstream_cache_status always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Next marks prerendered HTML s-maxage=1 year; a shared cache would then serve pages pointing at chunks of an old deploy
    location / {
        proxy_pass http://web;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }
}
