proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# nginx is the edge: overwrite instead of append, so a client cannot spoof the IP the login limiter sees
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $forwarded_scheme;
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;

# every location sets its own Cache-Control below
proxy_hide_header Cache-Control;
proxy_hide_header X-Powered-By;
proxy_hide_header X-Nextjs-Cache;
proxy_hide_header X-Nextjs-Prerender;
proxy_hide_header X-Nextjs-Stale-Time;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
